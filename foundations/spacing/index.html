<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spacing — DSL Design System</title>
  <link rel="stylesheet" href="../../output/variables.css" />
  <link rel="stylesheet" href="../../ds/ds.css" />
</head>
<body>
<script>window.DS_BASE = '../../';</script>
<script src="../../ds/theme-toggle.js"></script>

<header id="header"></header>
<div class="ds-shell">
  <aside id="sidebar"></aside>
  <main class="ds-main">
    <div class="ds-page-header">
      <h1>Spacing</h1>
      <p class="ds-page-description">The 10-step spacing scale used across all components.</p>
    </div>
    <section class="ds-section">
  <h2 class="ds-section-title">Spacing Scale</h2>
  
  <div class="ds-spacing-row">
    <div class="ds-spacing-bar" style="width:var(--spacing-1)"></div>
    <span class="ds-spacing-label"><strong>--spacing-1</strong> · 4px</span>
  </div>
  <div class="ds-spacing-row">
    <div class="ds-spacing-bar" style="width:var(--spacing-2)"></div>
    <span class="ds-spacing-label"><strong>--spacing-2</strong> · 8px</span>
  </div>
  <div class="ds-spacing-row">
    <div class="ds-spacing-bar" style="width:var(--spacing-3)"></div>
    <span class="ds-spacing-label"><strong>--spacing-3</strong> · 12px</span>
  </div>
  <div class="ds-spacing-row">
    <div class="ds-spacing-bar" style="width:var(--spacing-4)"></div>
    <span class="ds-spacing-label"><strong>--spacing-4</strong> · 16px</span>
  </div>
  <div class="ds-spacing-row">
    <div class="ds-spacing-bar" style="width:var(--spacing-5)"></div>
    <span class="ds-spacing-label"><strong>--spacing-5</strong> · 24px</span>
  </div>
  <div class="ds-spacing-row">
    <div class="ds-spacing-bar" style="width:var(--spacing-6)"></div>
    <span class="ds-spacing-label"><strong>--spacing-6</strong> · 32px</span>
  </div>
  <div class="ds-spacing-row">
    <div class="ds-spacing-bar" style="width:var(--spacing-7)"></div>
    <span class="ds-spacing-label"><strong>--spacing-7</strong> · 40px</span>
  </div>
  <div class="ds-spacing-row">
    <div class="ds-spacing-bar" style="width:var(--spacing-8)"></div>
    <span class="ds-spacing-label"><strong>--spacing-8</strong> · 64px</span>
  </div>
  <div class="ds-spacing-row">
    <div class="ds-spacing-bar" style="width:var(--spacing-9)"></div>
    <span class="ds-spacing-label"><strong>--spacing-9</strong> · 80px</span>
  </div>
  <div class="ds-spacing-row">
    <div class="ds-spacing-bar" style="width:var(--spacing-10)"></div>
    <span class="ds-spacing-label"><strong>--spacing-10</strong> · 120px</span>
  </div>
</section>
  </main>
</div>

<script src="../../ds/sidebar-nav.js"></script>
</body>
</html>
