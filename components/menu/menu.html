<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DSL Menu — Component Example</title>
  <link rel="stylesheet" href="../../output/variables.css" />
  <link rel="stylesheet" href="../button/button.css" />
  <link rel="stylesheet" href="menu.css" />
  <style>
    body { font-family: var(--typography-font-family-body); padding: var(--spacing-7); background: var(--color-bg-subtle); }
    .demo-section { margin-bottom: var(--spacing-6); }
    .demo-section h2 { font-size: var(--typography-font-size-sm); font-weight: var(--typography-font-weight-semibold); color: var(--color-text-muted); text-transform: uppercase; letter-spacing: var(--typography-letter-spacing-wide); margin: 0 0 var(--spacing-4); }
    .demo-row { display: flex; gap: var(--spacing-5); flex-wrap: wrap; align-items: flex-start; }
  </style>
</head>
<body>

  <div style="display:none" aria-hidden="true">
    <svg xmlns="http://www.w3.org/2000/svg">
      <symbol id="icon-user" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"/></symbol>
      <symbol id="icon-star" viewBox="0 0 20 20" fill="currentColor"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></symbol>
      <symbol id="icon-external-link" viewBox="0 0 20 20" fill="currentColor"><path d="M11 3a1 1 0 100 2h2.586l-6.293 6.293a1 1 0 101.414 1.414L15 6.414V9a1 1 0 102 0V4a1 1 0 00-1-1h-5z"/><path d="M5 5a2 2 0 00-2 2v8a2 2 0 002 2h8a2 2 0 002-2v-3a1 1 0 10-2 0v3H5V7h3a1 1 0 000-2H5z"/></symbol>
      <symbol id="icon-error" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/></symbol>
      <symbol id="icon-chevron-down" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/></symbol>
    </svg>
  </div>

  <div class="demo-section">
    <h2>Dropdown Menus</h2>
    <div class="demo-row">
      <!-- Basic menu -->
      <div class="dsl-menu" id="menu1">
        <button class="dsl-btn dsl-btn--ghost dsl-btn--md" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="menu1-panel" id="menu1-trigger">
          <span class="dsl-btn__text">Actions</span>
          <span class="dsl-btn__icon" aria-hidden="true"><svg width="16" height="16"><use href="#icon-chevron-down"/></svg></span>
        </button>
        <ul class="dsl-menu__panel" id="menu1-panel" role="menu" aria-labelledby="menu1-trigger">
          <li role="none">
            <button class="dsl-menu__item" type="button" role="menuitem">View Profile</button>
          </li>
          <li role="none">
            <button class="dsl-menu__item" type="button" role="menuitem">Schedule a Tour</button>
          </li>
          <li role="none">
            <button class="dsl-menu__item" type="button" role="menuitem">Add to Favorites</button>
          </li>
        </ul>
      </div>

      <!-- Menu with icons -->
      <div class="dsl-menu" id="menu2">
        <button class="dsl-btn dsl-btn--primary dsl-btn--md" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="menu2-panel" id="menu2-trigger">
          <span class="dsl-btn__text">Account</span>
          <span class="dsl-btn__icon" aria-hidden="true"><svg width="16" height="16"><use href="#icon-chevron-down"/></svg></span>
        </button>
        <ul class="dsl-menu__panel" id="menu2-panel" role="menu" aria-labelledby="menu2-trigger">
          <li role="none">
            <button class="dsl-menu__item" type="button" role="menuitem">
              <svg class="dsl-menu__item-icon" aria-hidden="true"><use href="#icon-user"/></svg>
              My Profile
            </button>
          </li>
          <li role="none">
            <button class="dsl-menu__item" type="button" role="menuitem">
              <svg class="dsl-menu__item-icon" aria-hidden="true"><use href="#icon-star"/></svg>
              Saved Communities
            </button>
          </li>
          <li role="none">
            <a class="dsl-menu__item" href="#" role="menuitem">
              <svg class="dsl-menu__item-icon" aria-hidden="true"><use href="#icon-external-link"/></svg>
              Visit Website
            </a>
          </li>
          <li role="none" class="dsl-menu__divider" aria-hidden="true"></li>
          <li role="none">
            <button class="dsl-menu__item dsl-menu__item--destructive" type="button" role="menuitem">
              <svg class="dsl-menu__item-icon" aria-hidden="true"><use href="#icon-error"/></svg>
              Sign Out
            </button>
          </li>
        </ul>
      </div>

      <!-- Right-aligned menu -->
      <div class="dsl-menu dsl-menu--align-right" id="menu3">
        <button class="dsl-btn dsl-btn--ghost dsl-btn--md dsl-btn--icon-only" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="menu3-panel" aria-label="More options" id="menu3-trigger">
          <span class="dsl-btn__icon" aria-hidden="true">
            <svg viewBox="0 0 20 20" fill="currentColor" width="20" height="20"><path d="M10 6a2 2 0 110-4 2 2 0 010 4zM10 12a2 2 0 110-4 2 2 0 010 4zM10 18a2 2 0 110-4 2 2 0 010 4z"/></svg>
          </span>
        </button>
        <ul class="dsl-menu__panel" id="menu3-panel" role="menu" aria-labelledby="menu3-trigger">
          <li role="none"><button class="dsl-menu__item" type="button" role="menuitem">Edit</button></li>
          <li role="none"><button class="dsl-menu__item" type="button" role="menuitem">Duplicate</button></li>
          <li role="none" class="dsl-menu__divider" aria-hidden="true"></li>
          <li role="none"><button class="dsl-menu__item dsl-menu__item--destructive" type="button" role="menuitem">Delete</button></li>
        </ul>
      </div>
    </div>
  </div>

  <script src="menu.js"></script>
</body>
</html>
