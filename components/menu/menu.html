<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DSL Menu — Component Example</title>
  <link rel="stylesheet" href="../../output/variables.css" />
  <link rel="stylesheet" href="../button/button.css" />
  <link rel="stylesheet" href="menu.css" />
  <link rel="stylesheet" href="../../node_modules/@phosphor-icons/web/src/bold/style.css" />
  <style>
    body { font-family: var(--typography-font-family-body); padding: var(--spacing-7); background: var(--color-bg-subtle); }
    .demo-section { margin-bottom: var(--spacing-6); }
    .demo-section h2 { font-size: var(--typography-font-size-sm); font-weight: var(--typography-font-weight-semibold); color: var(--color-text-muted); text-transform: uppercase; letter-spacing: var(--typography-letter-spacing-wide); margin: 0 0 var(--spacing-4); }
    .demo-row { display: flex; gap: var(--spacing-5); flex-wrap: wrap; align-items: flex-start; }
  </style>
</head>
<body>

  <div class="demo-section">
    <h2>Dropdown Menus</h2>
    <div class="demo-row">
      <!-- Basic menu -->
      <div class="dsl-menu" id="menu1">
        <button class="dsl-btn dsl-btn--ghost dsl-btn--md" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="menu1-panel" id="menu1-trigger">
          <span class="dsl-btn__text">Actions</span>
          <span class="dsl-btn__icon" aria-hidden="true"><i class="ph-bold ph-caret-down"></i></span>
        </button>
        <ul class="dsl-menu__panel" id="menu1-panel" role="menu" aria-labelledby="menu1-trigger">
          <li role="none">
            <button class="dsl-menu__item" type="button" role="menuitem">View Profile</button>
          </li>
          <li role="none">
            <button class="dsl-menu__item" type="button" role="menuitem">Schedule a Tour</button>
          </li>
          <li role="none">
            <button class="dsl-menu__item" type="button" role="menuitem">Add to Favorites</button>
          </li>
        </ul>
      </div>

      <!-- Menu with icons -->
      <div class="dsl-menu" id="menu2">
        <button class="dsl-btn dsl-btn--primary dsl-btn--md" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="menu2-panel" id="menu2-trigger">
          <span class="dsl-btn__text">Account</span>
          <span class="dsl-btn__icon" aria-hidden="true"><i class="ph-bold ph-caret-down"></i></span>
        </button>
        <ul class="dsl-menu__panel" id="menu2-panel" role="menu" aria-labelledby="menu2-trigger">
          <li role="none">
            <button class="dsl-menu__item" type="button" role="menuitem">
              <i class="ph-bold ph-user dsl-menu__item-icon" aria-hidden="true"></i>
              My Profile
            </button>
          </li>
          <li role="none">
            <button class="dsl-menu__item" type="button" role="menuitem">
              <i class="ph-bold ph-star dsl-menu__item-icon" aria-hidden="true"></i>
              Saved Communities
            </button>
          </li>
          <li role="none">
            <a class="dsl-menu__item" href="#" role="menuitem">
              <i class="ph-bold ph-arrow-square-out dsl-menu__item-icon" aria-hidden="true"></i>
              Visit Website
            </a>
          </li>
          <li role="none" class="dsl-menu__divider" aria-hidden="true"></li>
          <li role="none">
            <button class="dsl-menu__item dsl-menu__item--destructive" type="button" role="menuitem">
              <i class="ph-bold ph-x-circle dsl-menu__item-icon" aria-hidden="true"></i>
              Sign Out
            </button>
          </li>
        </ul>
      </div>

      <!-- Right-aligned menu -->
      <div class="dsl-menu dsl-menu--align-right" id="menu3">
        <button class="dsl-btn dsl-btn--ghost dsl-btn--md dsl-btn--icon-only" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="menu3-panel" aria-label="More options" id="menu3-trigger">
          <span class="dsl-btn__icon" aria-hidden="true">
            <i class="ph-bold ph-dots-three-vertical"></i>
          </span>
        </button>
        <ul class="dsl-menu__panel" id="menu3-panel" role="menu" aria-labelledby="menu3-trigger">
          <li role="none"><button class="dsl-menu__item" type="button" role="menuitem">Edit</button></li>
          <li role="none"><button class="dsl-menu__item" type="button" role="menuitem">Duplicate</button></li>
          <li role="none" class="dsl-menu__divider" aria-hidden="true"></li>
          <li role="none"><button class="dsl-menu__item dsl-menu__item--destructive" type="button" role="menuitem">Delete</button></li>
        </ul>
      </div>
    </div>
  </div>

  <script src="menu.js"></script>
</body>
</html>
