<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DSL Calendar — Component Example</title>
  <link rel="stylesheet" href="../../output/variables.css" />
  <link rel="stylesheet" href="calendar.css" />
  <style>
    body { font-family: var(--typography-font-family-body); padding: var(--spacing-7); background: var(--color-bg-subtle); }
    .demo-section { margin-bottom: var(--spacing-7); }
    .demo-section h2 { font-size: var(--typography-font-size-sm); font-weight: var(--typography-font-weight-semibold); color: var(--color-text-muted); text-transform: uppercase; letter-spacing: var(--typography-letter-spacing-wide); margin: 0 0 var(--spacing-4); }
    #selected-date { margin-top: var(--spacing-4); font-size: var(--typography-font-size-sm); color: var(--color-text-secondary); }
  </style>
</head>
<body>

  <div class="demo-section">
    <h2>Calendar</h2>
    <div class="dsl-calendar" id="calendar" role="application" aria-label="Calendar">
      <div class="dsl-calendar__header">
        <button class="dsl-calendar__nav" id="cal-prev" aria-label="Previous month" type="button">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd"/>
          </svg>
        </button>
        <h2 class="dsl-calendar__title" id="cal-title" aria-live="polite"></h2>
        <button class="dsl-calendar__nav" id="cal-next" aria-label="Next month" type="button">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"/>
          </svg>
        </button>
      </div>
      <div class="dsl-calendar__weekdays" aria-hidden="true">
        <div class="dsl-calendar__weekday">Su</div>
        <div class="dsl-calendar__weekday">Mo</div>
        <div class="dsl-calendar__weekday">Tu</div>
        <div class="dsl-calendar__weekday">We</div>
        <div class="dsl-calendar__weekday">Th</div>
        <div class="dsl-calendar__weekday">Fr</div>
        <div class="dsl-calendar__weekday">Sa</div>
      </div>
      <div class="dsl-calendar__grid" id="cal-grid" role="grid"></div>
    </div>
    <p id="selected-date"></p>
  </div>

  <script src="calendar.js"></script>
</body>
</html>
