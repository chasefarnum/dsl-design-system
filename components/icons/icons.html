<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DSL Icons — Component Example</title>
  <link rel="stylesheet" href="../../output/variables.css" />
  <link rel="stylesheet" href="icons.css" />
  <style>
    body { font-family: var(--typography-font-family-body); padding: var(--spacing-7); background: var(--color-bg-subtle); color: var(--color-text-primary); }
    .demo-section { margin-bottom: var(--spacing-7); }
    .demo-section h2 { font-size: var(--typography-font-size-sm); font-weight: var(--typography-font-weight-semibold); color: var(--color-text-muted); text-transform: uppercase; letter-spacing: var(--typography-letter-spacing-wide); margin: 0 0 var(--spacing-4); }
    .icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: var(--spacing-4); }
    .icon-item { display: flex; flex-direction: column; align-items: center; gap: var(--spacing-2); background: var(--color-bg-default); border-radius: var(--shape-radius-md); padding: var(--spacing-4); text-align: center; }
    .icon-item span { font-size: var(--typography-font-size-xs); color: var(--color-text-muted); word-break: break-word; }
    .size-row { display: flex; align-items: center; gap: var(--spacing-5); flex-wrap: wrap; }
    .size-item { display: flex; flex-direction: column; align-items: center; gap: var(--spacing-2); }
    .size-item span { font-size: var(--typography-font-size-xs); color: var(--color-text-muted); }
    .color-row { display: flex; align-items: center; gap: var(--spacing-4); }
  </style>
</head>
<body>

  <!-- Inline SVG sprite -->
  <div style="display:none" aria-hidden="true">
    <svg xmlns="http://www.w3.org/2000/svg">
      <symbol id="icon-arrow-right" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd"/></symbol>
      <symbol id="icon-arrow-left" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd"/></symbol>
      <symbol id="icon-chevron-down" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/></symbol>
      <symbol id="icon-chevron-up" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M14.707 12.707a1 1 0 01-1.414 0L10 9.414l-3.293 3.293a1 1 0 01-1.414-1.414l4-4a1 1 0 011.414 0l4 4a1 1 0 010 1.414z" clip-rule="evenodd"/></symbol>
      <symbol id="icon-chevron-right" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"/></symbol>
      <symbol id="icon-chevron-left" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd"/></symbol>
      <symbol id="icon-close" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/></symbol>
      <symbol id="icon-check" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></symbol>
      <symbol id="icon-search" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/></symbol>
      <symbol id="icon-menu" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"/></symbol>
      <symbol id="icon-external-link" viewBox="0 0 20 20" fill="currentColor"><path d="M11 3a1 1 0 100 2h2.586l-6.293 6.293a1 1 0 101.414 1.414L15 6.414V9a1 1 0 102 0V4a1 1 0 00-1-1h-5z"/><path d="M5 5a2 2 0 00-2 2v8a2 2 0 002 2h8a2 2 0 002-2v-3a1 1 0 10-2 0v3H5V7h3a1 1 0 000-2H5z"/></symbol>
      <symbol id="icon-phone" viewBox="0 0 20 20" fill="currentColor"><path d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C7.82 18 2 12.18 2 5V3z"/></symbol>
      <symbol id="icon-email" viewBox="0 0 20 20" fill="currentColor"><path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"/><path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"/></symbol>
      <symbol id="icon-star" viewBox="0 0 20 20" fill="currentColor"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></symbol>
      <symbol id="icon-user" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"/></symbol>
      <symbol id="icon-calendar" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z" clip-rule="evenodd"/></symbol>
      <symbol id="icon-info" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/></symbol>
      <symbol id="icon-warning" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></symbol>
      <symbol id="icon-error" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/></symbol>
      <symbol id="icon-success" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></symbol>
    </svg>
  </div>

  <div class="demo-section">
    <h2>All Icons — 24px</h2>
    <div class="icon-grid">
      <div class="icon-item"><svg class="dsl-icon dsl-icon--24" aria-hidden="true"><use href="#icon-arrow-right"/></svg><span>arrow-right</span></div>
      <div class="icon-item"><svg class="dsl-icon dsl-icon--24" aria-hidden="true"><use href="#icon-arrow-left"/></svg><span>arrow-left</span></div>
      <div class="icon-item"><svg class="dsl-icon dsl-icon--24" aria-hidden="true"><use href="#icon-chevron-down"/></svg><span>chevron-down</span></div>
      <div class="icon-item"><svg class="dsl-icon dsl-icon--24" aria-hidden="true"><use href="#icon-chevron-up"/></svg><span>chevron-up</span></div>
      <div class="icon-item"><svg class="dsl-icon dsl-icon--24" aria-hidden="true"><use href="#icon-chevron-right"/></svg><span>chevron-right</span></div>
      <div class="icon-item"><svg class="dsl-icon dsl-icon--24" aria-hidden="true"><use href="#icon-chevron-left"/></svg><span>chevron-left</span></div>
      <div class="icon-item"><svg class="dsl-icon dsl-icon--24" aria-hidden="true"><use href="#icon-close"/></svg><span>close</span></div>
      <div class="icon-item"><svg class="dsl-icon dsl-icon--24" aria-hidden="true"><use href="#icon-check"/></svg><span>check</span></div>
      <div class="icon-item"><svg class="dsl-icon dsl-icon--24" aria-hidden="true"><use href="#icon-search"/></svg><span>search</span></div>
      <div class="icon-item"><svg class="dsl-icon dsl-icon--24" aria-hidden="true"><use href="#icon-menu"/></svg><span>menu</span></div>
      <div class="icon-item"><svg class="dsl-icon dsl-icon--24" aria-hidden="true"><use href="#icon-external-link"/></svg><span>external-link</span></div>
      <div class="icon-item"><svg class="dsl-icon dsl-icon--24" aria-hidden="true"><use href="#icon-phone"/></svg><span>phone</span></div>
      <div class="icon-item"><svg class="dsl-icon dsl-icon--24" aria-hidden="true"><use href="#icon-email"/></svg><span>email</span></div>
      <div class="icon-item"><svg class="dsl-icon dsl-icon--24" aria-hidden="true"><use href="#icon-star"/></svg><span>star</span></div>
      <div class="icon-item"><svg class="dsl-icon dsl-icon--24" aria-hidden="true"><use href="#icon-user"/></svg><span>user</span></div>
      <div class="icon-item"><svg class="dsl-icon dsl-icon--24" aria-hidden="true"><use href="#icon-calendar"/></svg><span>calendar</span></div>
      <div class="icon-item"><svg class="dsl-icon dsl-icon--24" aria-hidden="true"><use href="#icon-info"/></svg><span>info</span></div>
      <div class="icon-item"><svg class="dsl-icon dsl-icon--24" aria-hidden="true"><use href="#icon-warning"/></svg><span>warning</span></div>
      <div class="icon-item"><svg class="dsl-icon dsl-icon--24" aria-hidden="true"><use href="#icon-error"/></svg><span>error</span></div>
      <div class="icon-item"><svg class="dsl-icon dsl-icon--24" aria-hidden="true"><use href="#icon-success"/></svg><span>success</span></div>
    </div>
  </div>

  <div class="demo-section">
    <h2>Sizes</h2>
    <div class="size-row">
      <div class="size-item"><svg class="dsl-icon dsl-icon--16"><use href="#icon-star"/></svg><span>16</span></div>
      <div class="size-item"><svg class="dsl-icon dsl-icon--20"><use href="#icon-star"/></svg><span>20</span></div>
      <div class="size-item"><svg class="dsl-icon dsl-icon--24"><use href="#icon-star"/></svg><span>24</span></div>
      <div class="size-item"><svg class="dsl-icon dsl-icon--32"><use href="#icon-star"/></svg><span>32</span></div>
    </div>
  </div>

  <div class="demo-section">
    <h2>Colors (via currentColor)</h2>
    <div class="color-row">
      <svg class="dsl-icon dsl-icon--24" style="color:var(--color-brand-primary)" aria-label="Brand primary"><use href="#icon-star"/></svg>
      <svg class="dsl-icon dsl-icon--24" style="color:var(--color-brand-secondary)" aria-label="Brand secondary"><use href="#icon-star"/></svg>
      <svg class="dsl-icon dsl-icon--24" style="color:var(--color-semantic-success)" aria-label="Success"><use href="#icon-success"/></svg>
      <svg class="dsl-icon dsl-icon--24" style="color:var(--color-semantic-warning)" aria-label="Warning"><use href="#icon-warning"/></svg>
      <svg class="dsl-icon dsl-icon--24" style="color:var(--color-semantic-error)" aria-label="Error"><use href="#icon-error"/></svg>
      <svg class="dsl-icon dsl-icon--24" style="color:var(--color-text-muted)" aria-label="Muted"><use href="#icon-info"/></svg>
    </div>
  </div>

</body>
</html>
