<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DSL Icons — Component Example</title>
  <link rel="stylesheet" href="../../output/variables.css" />
  <link rel="stylesheet" href="icons.css" />
  <link rel="stylesheet" href="../../node_modules/@phosphor-icons/web/src/bold/style.css" />
  <style>
    body { font-family: var(--typography-font-family-body); padding: var(--spacing-7); background: var(--color-bg-subtle); color: var(--color-text-primary); }
    .demo-section { margin-bottom: var(--spacing-7); }
    .demo-section h2 { font-size: var(--typography-font-size-sm); font-weight: var(--typography-font-weight-semibold); color: var(--color-text-muted); text-transform: uppercase; letter-spacing: var(--typography-letter-spacing-wide); margin: 0 0 var(--spacing-4); }
    .icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: var(--spacing-4); }
    .icon-item { display: flex; flex-direction: column; align-items: center; gap: var(--spacing-2); background: var(--color-bg-default); border-radius: var(--shape-radius-md); padding: var(--spacing-4); text-align: center; }
    .icon-item span { font-size: var(--typography-font-size-xs); color: var(--color-text-muted); word-break: break-word; }
    .size-row { display: flex; align-items: center; gap: var(--spacing-5); flex-wrap: wrap; }
    .size-item { display: flex; flex-direction: column; align-items: center; gap: var(--spacing-2); }
    .size-item span { font-size: var(--typography-font-size-xs); color: var(--color-text-muted); }
    .color-row { display: flex; align-items: center; gap: var(--spacing-4); }
  </style>
</head>
<body>

  <div class="demo-section">
    <h2>All Icons — 24px</h2>
    <div class="icon-grid">
      <div class="icon-item"><i class="ph-bold ph-arrow-right dsl-icon dsl-icon--24" aria-hidden="true"></i><span>arrow-right</span></div>
      <div class="icon-item"><i class="ph-bold ph-arrow-left dsl-icon dsl-icon--24" aria-hidden="true"></i><span>arrow-left</span></div>
      <div class="icon-item"><i class="ph-bold ph-caret-down dsl-icon dsl-icon--24" aria-hidden="true"></i><span>caret-down</span></div>
      <div class="icon-item"><i class="ph-bold ph-caret-up dsl-icon dsl-icon--24" aria-hidden="true"></i><span>caret-up</span></div>
      <div class="icon-item"><i class="ph-bold ph-caret-right dsl-icon dsl-icon--24" aria-hidden="true"></i><span>caret-right</span></div>
      <div class="icon-item"><i class="ph-bold ph-caret-left dsl-icon dsl-icon--24" aria-hidden="true"></i><span>caret-left</span></div>
      <div class="icon-item"><i class="ph-bold ph-x dsl-icon dsl-icon--24" aria-hidden="true"></i><span>close</span></div>
      <div class="icon-item"><i class="ph-bold ph-check dsl-icon dsl-icon--24" aria-hidden="true"></i><span>check</span></div>
      <div class="icon-item"><i class="ph-bold ph-magnifying-glass dsl-icon dsl-icon--24" aria-hidden="true"></i><span>search</span></div>
      <div class="icon-item"><i class="ph-bold ph-list dsl-icon dsl-icon--24" aria-hidden="true"></i><span>menu</span></div>
      <div class="icon-item"><i class="ph-bold ph-arrow-square-out dsl-icon dsl-icon--24" aria-hidden="true"></i><span>external-link</span></div>
      <div class="icon-item"><i class="ph-bold ph-phone dsl-icon dsl-icon--24" aria-hidden="true"></i><span>phone</span></div>
      <div class="icon-item"><i class="ph-bold ph-envelope-simple dsl-icon dsl-icon--24" aria-hidden="true"></i><span>email</span></div>
      <div class="icon-item"><i class="ph-bold ph-star dsl-icon dsl-icon--24" aria-hidden="true"></i><span>star</span></div>
      <div class="icon-item"><i class="ph-bold ph-user dsl-icon dsl-icon--24" aria-hidden="true"></i><span>user</span></div>
      <div class="icon-item"><i class="ph-bold ph-calendar-blank dsl-icon dsl-icon--24" aria-hidden="true"></i><span>calendar</span></div>
      <div class="icon-item"><i class="ph-bold ph-info dsl-icon dsl-icon--24" aria-hidden="true"></i><span>info</span></div>
      <div class="icon-item"><i class="ph-bold ph-warning dsl-icon dsl-icon--24" aria-hidden="true"></i><span>warning</span></div>
      <div class="icon-item"><i class="ph-bold ph-x-circle dsl-icon dsl-icon--24" aria-hidden="true"></i><span>error</span></div>
      <div class="icon-item"><i class="ph-bold ph-check-circle dsl-icon dsl-icon--24" aria-hidden="true"></i><span>success</span></div>
    </div>
  </div>

  <div class="demo-section">
    <h2>Sizes</h2>
    <div class="size-row">
      <div class="size-item"><i class="ph-bold ph-star dsl-icon dsl-icon--16" aria-hidden="true"></i><span>16</span></div>
      <div class="size-item"><i class="ph-bold ph-star dsl-icon dsl-icon--20" aria-hidden="true"></i><span>20</span></div>
      <div class="size-item"><i class="ph-bold ph-star dsl-icon dsl-icon--24" aria-hidden="true"></i><span>24</span></div>
      <div class="size-item"><i class="ph-bold ph-star dsl-icon dsl-icon--32" aria-hidden="true"></i><span>32</span></div>
    </div>
  </div>

  <div class="demo-section">
    <h2>Colors (via currentColor)</h2>
    <div class="color-row">
      <i class="ph-bold ph-star dsl-icon dsl-icon--24" style="color:var(--color-brand-primary)" aria-label="Brand primary"></i>
      <i class="ph-bold ph-star dsl-icon dsl-icon--24" style="color:var(--color-brand-secondary)" aria-label="Brand secondary"></i>
      <i class="ph-bold ph-check-circle dsl-icon dsl-icon--24" style="color:var(--color-semantic-success)" aria-label="Success"></i>
      <i class="ph-bold ph-warning dsl-icon dsl-icon--24" style="color:var(--color-semantic-warning)" aria-label="Warning"></i>
      <i class="ph-bold ph-x-circle dsl-icon dsl-icon--24" style="color:var(--color-semantic-error)" aria-label="Error"></i>
      <i class="ph-bold ph-info dsl-icon dsl-icon--24" style="color:var(--color-text-muted)" aria-label="Muted"></i>
    </div>
  </div>

</body>
</html>
