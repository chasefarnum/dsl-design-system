<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DSL Navigation — Component Example</title>
  <link rel="stylesheet" href="../../output/variables.css" />
  <link rel="stylesheet" href="../button/button.css" />
  <link rel="stylesheet" href="navigation.css" />
  <style>
    body { font-family: var(--typography-font-family-body); background: var(--color-bg-subtle); min-height: 100vh; margin: 0; }
    .page-content { padding: var(--spacing-7); color: var(--color-text-secondary); font-size: var(--typography-font-size-md); }
  </style>
</head>
<body>

  <nav class="dsl-nav dsl-nav--sticky" id="main-nav" aria-label="Main navigation">
    <div class="dsl-nav__inner">
      <a class="dsl-nav__logo" href="#">DSL</a>

      <button class="dsl-nav__hamburger" type="button" aria-controls="nav-links" aria-expanded="false" aria-label="Toggle menu" id="nav-hamburger">
        <span class="dsl-nav__hamburger-bar"></span>
        <span class="dsl-nav__hamburger-bar"></span>
        <span class="dsl-nav__hamburger-bar"></span>
      </button>

      <ul class="dsl-nav__links" id="nav-links" role="list">
        <li class="dsl-nav__item">
          <a class="dsl-nav__link dsl-nav__link--active" href="#">Communities</a>
        </li>
        <li class="dsl-nav__item">
          <!-- Item with submenu -->
          <button class="dsl-nav__link" type="button" aria-haspopup="true" aria-expanded="false" id="nav-care-btn">
            Care Options
            <svg class="dsl-nav__link-chevron" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/>
            </svg>
          </button>
          <ul class="dsl-nav__submenu" role="menu" aria-labelledby="nav-care-btn">
            <li role="none"><a class="dsl-nav__submenu-link" href="#" role="menuitem">Independent Living</a></li>
            <li role="none"><a class="dsl-nav__submenu-link" href="#" role="menuitem">Assisted Living</a></li>
            <li role="none"><a class="dsl-nav__submenu-link" href="#" role="menuitem">Memory Care</a></li>
            <li role="none"><a class="dsl-nav__submenu-link" href="#" role="menuitem">Skilled Nursing</a></li>
          </ul>
        </li>
        <li class="dsl-nav__item">
          <a class="dsl-nav__link" href="#">Resources</a>
        </li>
        <li class="dsl-nav__item">
          <a class="dsl-nav__link" href="#">About</a>
        </li>
        <li class="dsl-nav__item">
          <a class="dsl-nav__link" href="#">Contact</a>
        </li>
        <li class="dsl-nav__item">
          <div class="dsl-nav__cta">
            <a href="#" class="dsl-btn dsl-btn--primary dsl-btn--sm"><span class="dsl-btn__text">Schedule a Tour</span></a>
          </div>
        </li>
      </ul>

      <div class="dsl-nav__cta">
        <a href="tel:8005551234" class="dsl-btn dsl-btn--ghost dsl-btn--sm"><span class="dsl-btn__text">1-800-555-1234</span></a>
        <a href="#" class="dsl-btn dsl-btn--primary dsl-btn--sm"><span class="dsl-btn__text">Schedule a Tour</span></a>
      </div>
    </div>
  </nav>

  <div class="page-content">
    <p>Scroll down to see the sticky navigation. Resize the window to test the mobile hamburger menu.</p>
  </div>

  <script src="navigation.js"></script>
</body>
</html>
