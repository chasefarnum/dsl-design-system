<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DSL Inputs — Component Example</title>
  <link rel="stylesheet" href="../../output/variables.css" />
  <link rel="stylesheet" href="inputs.css" />
  <link rel="stylesheet" href="../../node_modules/@phosphor-icons/web/src/bold/style.css" />
  <style>
    body { font-family: var(--typography-font-family-body); padding: var(--spacing-7); background: var(--color-bg-subtle); }
    .demo-section { margin-bottom: var(--spacing-7); max-width: 480px; }
    .demo-section h2 { font-size: var(--typography-font-size-sm); font-weight: var(--typography-font-weight-semibold); color: var(--color-text-muted); text-transform: uppercase; letter-spacing: var(--typography-letter-spacing-wide); margin: 0 0 var(--spacing-4); }
    .field-stack { display: flex; flex-direction: column; gap: var(--spacing-5); }
  </style>
</head>
<body>

  <div class="demo-section">
    <h2>Input Types</h2>
    <div class="field-stack">
      <!-- Text -->
      <div class="dsl-input-field">
        <label class="dsl-input-label" for="in-text">Full Name</label>
        <div class="dsl-input-wrapper">
          <input class="dsl-input dsl-input--md" type="text" id="in-text" placeholder="Jane Doe" />
        </div>
      </div>
      <!-- Email with prefix icon -->
      <div class="dsl-input-field">
        <label class="dsl-input-label" for="in-email">Email</label>
        <div class="dsl-input-wrapper">
          <span class="dsl-input-prefix" aria-hidden="true">
            <i class="ph-bold ph-envelope-simple" aria-hidden="true"></i>
          </span>
          <input class="dsl-input dsl-input--md dsl-input--has-prefix" type="email" id="in-email" placeholder="jane@example.com" />
        </div>
      </div>
      <!-- Phone with prefix icon -->
      <div class="dsl-input-field">
        <label class="dsl-input-label" for="in-phone">Phone</label>
        <div class="dsl-input-wrapper">
          <span class="dsl-input-prefix" aria-hidden="true">
            <i class="ph-bold ph-phone" aria-hidden="true"></i>
          </span>
          <input class="dsl-input dsl-input--md dsl-input--has-prefix" type="tel" id="in-phone" placeholder="(555) 000-0000" />
        </div>
        <span class="dsl-input-helper">US format preferred.</span>
      </div>
      <!-- Search -->
      <div class="dsl-input-field">
        <label class="dsl-input-label" for="in-search">Search Communities</label>
        <div class="dsl-input-wrapper">
          <span class="dsl-input-prefix" aria-hidden="true">
            <i class="ph-bold ph-magnifying-glass" aria-hidden="true"></i>
          </span>
          <input class="dsl-input dsl-input--md dsl-input--has-prefix" type="search" id="in-search" placeholder="Search by city or zip…" />
        </div>
      </div>
      <!-- Password -->
      <div class="dsl-input-field">
        <label class="dsl-input-label" for="in-password">Password</label>
        <div class="dsl-input-wrapper">
          <input class="dsl-input dsl-input--md" type="password" id="in-password" placeholder="••••••••" />
        </div>
      </div>
      <!-- Select -->
      <div class="dsl-input-field">
        <label class="dsl-input-label" for="in-select">Care Type</label>
        <div class="dsl-input-wrapper dsl-input-wrapper--select">
          <select class="dsl-input dsl-input--md dsl-input--select" id="in-select">
            <option value="">Select…</option>
            <option>Independent Living</option>
            <option>Assisted Living</option>
            <option>Memory Care</option>
          </select>
        </div>
      </div>
      <!-- Textarea with char count -->
      <div class="dsl-input-field">
        <label class="dsl-input-label" for="in-textarea">Message</label>
        <div class="dsl-input-wrapper">
          <textarea class="dsl-input dsl-input--md dsl-input--textarea" id="in-textarea" placeholder="Your message…" maxlength="250" rows="4"></textarea>
        </div>
        <div class="dsl-input-count"><span id="char-count">0</span> / 250</div>
      </div>
    </div>
  </div>

  <div class="demo-section">
    <h2>Sizes</h2>
    <div class="field-stack">
      <div class="dsl-input-field">
        <label class="dsl-input-label" for="in-sm">Small</label>
        <input class="dsl-input dsl-input--sm" type="text" id="in-sm" placeholder="Small input" />
      </div>
      <div class="dsl-input-field">
        <label class="dsl-input-label" for="in-md">Medium</label>
        <input class="dsl-input dsl-input--md" type="text" id="in-md" placeholder="Medium input" />
      </div>
      <div class="dsl-input-field">
        <label class="dsl-input-label" for="in-lg">Large</label>
        <input class="dsl-input dsl-input--lg" type="text" id="in-lg" placeholder="Large input" />
      </div>
    </div>
  </div>

  <div class="demo-section">
    <h2>States</h2>
    <div class="field-stack">
      <div class="dsl-input-field">
        <label class="dsl-input-label" for="st-default">Default</label>
        <input class="dsl-input dsl-input--md" type="text" id="st-default" placeholder="Enter value…" />
      </div>
      <div class="dsl-input-field">
        <label class="dsl-input-label" for="st-filled">Filled</label>
        <input class="dsl-input dsl-input--md" type="text" id="st-filled" value="Sunrise Gardens" />
      </div>
      <div class="dsl-input-field dsl-input-field--error">
        <label class="dsl-input-label" for="st-error">Error</label>
        <div class="dsl-input-wrapper">
          <input class="dsl-input dsl-input--md dsl-input--has-suffix" type="text" id="st-error" value="bad@" aria-invalid="true" aria-describedby="st-error-help" />
          <span class="dsl-input-suffix" style="color:var(--color-semantic-error)" aria-hidden="true">
            <i class="ph-bold ph-x-circle" aria-hidden="true"></i>
          </span>
        </div>
        <span class="dsl-input-helper" id="st-error-help" role="alert">Please enter a valid email address.</span>
      </div>
      <div class="dsl-input-field">
        <label class="dsl-input-label" for="st-disabled">Disabled</label>
        <input class="dsl-input dsl-input--md" type="text" id="st-disabled" value="Not editable" disabled />
      </div>
    </div>
  </div>

  <script>
    const textarea = document.getElementById('in-textarea');
    const count = document.getElementById('char-count');
    if (textarea && count) {
      textarea.addEventListener('input', function () {
        count.textContent = this.value.length;
      });
    }
  </script>
</body>
</html>
